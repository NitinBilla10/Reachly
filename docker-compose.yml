version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reachly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachly
      POSTGRES_PASSWORD: reachly_password_123
      POSTGRES_DB: reachly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
